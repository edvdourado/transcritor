[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcritor-backend"
version = "0.1.0"
description = "Local API for the Transcritor application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.47.2,<2",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
